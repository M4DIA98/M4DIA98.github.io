<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>آتیشی 🔥</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b0b0f;
  --card:rgba(20,20,28,.72);
  --border:rgba(255,255,255,.08);
  --text:#f5f5f7;
  --muted:#a9a9b3;
  --accent:#ff6a00;
  --accent2:#ff9a3d;
  --me:#1f2a44;
  --other:#1d1d25;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Vazirmatn',sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
}
body::before,body::after{
  content:"";
  position:fixed;
  width:520px;height:520px;border-radius:50%;
  filter:blur(80px);z-index:-1;
  animation:float 10s ease-in-out infinite;
}
body::before{background:rgba(255,90,0,.28);top:-140px;right:-120px}
body::after{background:rgba(255,180,0,.14);bottom:-160px;left:-120px;animation-delay:-5s}
@keyframes float{
  0%,100%{transform:translateY(0) translateX(0)}
  50%{transform:translateY(28px) translateX(-18px)}
}

.app{
  width:min(980px,96vw);
  height:min(92vh,900px);
  display:grid;
  grid-template-columns:300px 1fr;
  gap:16px;
}
.sidebar,.chat{
  background:var(--card);
  border:1px solid var(--border);
  backdrop-filter:blur(18px);
  border-radius:28px;
  box-shadow:0 18px 40px rgba(0,0,0,.45);
}
.sidebar{
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:18px;
}
.brand{
  display:flex;
  align-items:center;
  gap:14px;
}
.logo{
  width:58px;height:58px;border-radius:18px;
  display:grid;place-items:center;font-size:28px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}
.profile-card{
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);
  border-radius:22px;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.profile-card input,.profile-card textarea{
  width:100%;
  padding:12px;
  border-radius:16px;
  border:1px solid var(--border);
  background:#11131a;
  color:#fff;
  font:inherit;
  outline:none;
  resize:none;
}
.avatar-wrap{
  display:flex;
  justify-content:center;
}
.avatar-wrap img{
  width:92px;height:92px;border-radius:50%;
  object-fit:cover;
}
.save-btn,.logout-btn{
  border:none;
  border-radius:16px;
  padding:12px;
  color:#fff;
  cursor:pointer;
  font:inherit;
  font-weight:700;
}
.save-btn{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}
.logout-btn{
  background:#2a2a35;
}

.chat{
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.chat-header{
  padding:18px 22px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.messages{
  flex:1;
  overflow-y:auto;
  padding:22px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.message{
  display:flex;
  gap:10px;
  align-items:flex-end;
}
.message.me{
  flex-direction:row-reverse;
}
.avatar{
  width:40px;height:40px;border-radius:14px;
  object-fit:cover;
  cursor:pointer;
}
.bubble{
  max-width:min(72%,520px);
  background:var(--other);
  border-radius:22px;
  padding:12px 14px;
}
.message.me .bubble{
  background:var(--me);
}
.meta{
  display:flex;
  gap:8px;
  margin-bottom:6px;
  font-size:12px;
}
.name{
  font-weight:700;
  color:#ffd29f;
  cursor:pointer;
}
.time{
  color:var(--muted);
}
.text{
  white-space:pre-wrap;
  line-height:1.9;
}

.composer{
  padding:18px;
  border-top:1px solid var(--border);
}
.form{
  display:flex;
  gap:12px;
  background:#101218;
  border:1px solid var(--border);
  border-radius:22px;
  padding:10px 12px;
}
.form input{
  flex:1;
  background:transparent;
  border:none;
  color:#fff;
  outline:none;
  font:inherit;
}
.send{
  width:54px;height:54px;border:none;border-radius:18px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  cursor:pointer;
  font-size:20px;
}

.auth-box{
  position:fixed;
  inset:0;
  background:#0b0b0f;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:12px;
  z-index:3000;
}
.auth-box input{
  width:min(340px,88vw);
  padding:14px;
  border-radius:16px;
  border:1px solid var(--border);
  background:#11131a;
  color:#fff;
  font:inherit;
  outline:none;
}
.auth-actions{
  display:flex;
  gap:10px;
}
#authStatus{
  color:#ffb36b;
  min-height:24px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:2500;
}
.modal.show{
  display:flex;
}
.modal-box{
  width:min(360px,92vw);
  background:#171922;
  border-radius:28px;
  padding:26px;
  text-align:center;
  position:relative;
}
.modal-avatar{
  width:110px;height:110px;border-radius:50%;
  object-fit:cover;
}
.close-btn{
  position:absolute;
  top:12px;
  left:12px;
  width:38px;height:38px;
  border:none;border-radius:12px;
  background:#242735;color:#fff;
  cursor:pointer;
}

@media (max-width:860px){
  .app{
    grid-template-columns:1fr;
    width:100vw;
    height:100vh;
    gap:0;
  }
  .sidebar{
    display:none;
  }
  .chat{
    border-radius:0;
    border:none;
  }
}
</style>
</head>
<body>

<!-- فرم ورود -->
<div id="authBox" class="auth-box">
  <h2>🔥 ورود به آتیشی</h2>
  <input id="email" type="email" placeholder="ایمیل">
  <input id="password" type="password" placeholder="رمز عبور">

  <div class="auth-actions">
    <button id="signupBtn" class="save-btn">ثبت‌نام</button>
    <button id="loginBtn" class="save-btn">ورود</button>
  </div>

  <p id="authStatus"></p>
</div>

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="logo">🔥</div>
      <div>
        <h2>آتیشی</h2>
        <small>چت‌روم زنده فارسی</small>
      </div>
    </div>

    <div class="profile-card">
      <div class="avatar-wrap">
        <img id="myAvatarPreview" src="https://api.dicebear.com/9.x/thumbs/svg?seed=Atishi">
      </div>

      <input id="username" placeholder="نام کاربری">
      <textarea id="bio" rows="3" placeholder="بیوگرافی کوتاه..."></textarea>
      <input id="avatarUrl" placeholder="لینک عکس پروفایل">

      <button id="saveProfile" class="save-btn">ذخیره پروفایل</button>
      <button id="logoutBtn" class="logout-btn">خروج از حساب</button>
    </div>
  </aside>

  <main class="chat">
    <div class="chat-header">
      <div>
        <h2>🔥 آتیشی</h2>
        <small>گفتگوی عمومی</small>
      </div>
    </div>

    <section id="messages" class="messages"></section>

    <div class="composer">
      <form id="form" class="form">
        <input id="text" placeholder="پیامت را بنویس..." required>
        <button class="send" type="submit">➤</button>
      </form>
    </div>
  </main>

</div>

<!-- مودال پروفایل -->
<div id="profileModal" class="modal">
  <div class="modal-box">
    <button id="closeModal" class="close-btn">✕</button>
    <img id="modalAvatar" class="modal-avatar" src="">
    <h3 id="modalName"></h3>
    <p id="modalBio"></p>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

// 🔥 مقادیر خودت را بگذار
const SUPABASE_URL = 'https://wmeqqiqtmhqtwejrjzoy.supabase.co'
const SUPABASE_KEY = 'sb_publishable_om07_Xz5JrKokPletMj_VQ_LHpI09j6'

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

// عناصر
const authBox = document.getElementById('authBox')
const authStatus = document.getElementById('authStatus')
const messages = document.getElementById('messages')
const form = document.getElementById('form')
const textInput = document.getElementById('text')

const usernameInput = document.getElementById('username')
const bioInput = document.getElementById('bio')
const avatarInput = document.getElementById('avatarUrl')
const avatarPreview = document.getElementById('myAvatarPreview')
const saveBtn = document.getElementById('saveProfile')

// ورود و ثبت‌نام
async function updateAuthUI(){
  const { data:{ session } } = await supabase.auth.getSession()
  authBox.style.display = session ? 'none' : 'flex'
}
await updateAuthUI()

document.getElementById('signupBtn').onclick = async ()=>{
  const email = document.getElementById('email').value.trim()
  const password = document.getElementById('password').value

  const { error } = await supabase.auth.signUp({ email, password })
  authStatus.textContent = error ? '❌ ' + error.message : '✅ ثبت‌نام شد'
}

document.getElementById('loginBtn').onclick = async ()=>{
  const email = document.getElementById('email').value.trim()
  const password = document.getElementById('password').value

  const { error } = await supabase.auth.signInWithPassword({ email, password })
  authStatus.textContent = error ? '❌ ' + error.message : '✅ ورود موفق'

  await updateAuthUI()
}

document.getElementById('logoutBtn').onclick = async ()=>{
  await supabase.auth.signOut()
  location.reload()
}

// پیش‌نمایش آواتار
avatarInput.addEventListener('input',()=>{
  avatarPreview.src = avatarInput.value.trim() ||
    'https://api.dicebear.com/9.x/thumbs/svg?seed=' + (usernameInput.value || 'Atishi')
})

// بارگذاری پروفایل
async function loadMyProfile(){
  const { data:{ session } } = await supabase.auth.getSession()
  if(!session) return

  const { data } = await supabase
    .from('profiles')
    .select('*')
    .eq('owner', session.user.id)
    .single()

  if(data){
    usernameInput.value = data.username
    bioInput.value = data.bio || ''
    avatarInput.value = data.avatar || ''
    avatarPreview.src = data.avatar ||
      'https://api.dicebear.com/9.x/thumbs/svg?seed=' + data.username
  }
}
await loadMyProfile()

// ذخیره پروفایل
saveBtn.onclick = async ()=>{
  const { data:{ session } } = await supabase.auth.getSession()
  if(!session) return alert('اول وارد شو')

  const payload = {
    owner: session.user.id,
    username: usernameInput.value.trim(),
    bio: bioInput.value.trim(),
    avatar: avatarInput.value.trim()
  }

  const { data: existing } = await supabase
    .from('profiles')
    .select('id')
    .eq('owner', session.user.id)
    .single()

  if(existing){
    await supabase.from('profiles')
      .update(payload)
      .eq('owner', session.user.id)
  }else{
    await supabase.from('profiles').insert(payload)
  }

  alert('پروفایل ذخیره شد 🔥')
}

// مودال پروفایل
const modal = document.getElementById('profileModal')

function openProfile(name, avatar, bio){
  document.getElementById('modalName').textContent = name
  document.getElementById('modalAvatar').src = avatar
  document.getElementById('modalBio').textContent = bio || 'بیویی ثبت نشده'
  modal.classList.add('show')
}

document.getElementById('closeModal').onclick =
  ()=> modal.classList.remove('show')

modal.onclick = e=>{
  if(e.target === modal) modal.classList.remove('show')
}

// نمایش پیام
async function addMessage(m){
  const { data: profile } = await supabase
    .from('profiles')
    .select('*')
    .eq('username', m.username)
    .single()

  const avatar = profile?.avatar ||
    'https://api.dicebear.com/9.x/thumbs/svg?seed=' + m.username

  const bio = profile?.bio || ''

  const me = m.username === usernameInput.value.trim()

  const time = new Date(m.created_at).toLocaleTimeString('fa-IR',{
    hour:'2-digit',
    minute:'2-digit'
  })

  const el = document.createElement('div')
  el.className = 'message' + (me ? ' me' : '')

  el.innerHTML = `
    <img class="avatar" src="${avatar}">
    <div class="bubble">
      <div class="meta">
        <span class="name">${m.username}</span>
        <span class="time">${time}</span>
      </div>
      <div class="text">${m.message}</div>
    </div>
  `

  el.querySelector('.avatar').onclick =
    ()=> openProfile(m.username, avatar, bio)

  el.querySelector('.name').onclick =
    ()=> openProfile(m.username, avatar, bio)

  messages.appendChild(el)
  messages.scrollTop = messages.scrollHeight
}

// پیام‌های قبلی
const { data: oldMessages } = await supabase
  .from('messages')
  .select('*')
  .order('created_at',{ascending:true})

oldMessages.forEach(addMessage)

// پیام زنده
supabase.channel('chat-room')
  .on('postgres_changes',{
      event:'INSERT',
      schema:'public',
      table:'messages'
    },payload=> addMessage(payload.new))
  .subscribe()

// ارسال پیام
form.addEventListener('submit', async e=>{
  e.preventDefault()

  const username = usernameInput.value.trim()
  const text = textInput.value.trim()

  if(!username) return alert('اول پروفایل بساز')
  if(!text) return

  await supabase.from('messages').insert({
    username,
    message:text,
    avatar:avatarInput.value.trim()
  })

  textInput.value=''
})
</script>

</body>
</html>
